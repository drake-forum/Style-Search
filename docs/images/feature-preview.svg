<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Style Search feature preview</title>
  <desc id="desc">Illustration of a dark translucent Style Search launcher and appearance settings.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#09111b"/><stop offset=".54" stop-color="#111b2b"/><stop offset="1" stop-color="#21122d"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#6d4aff" stop-opacity=".42"/><stop offset="1" stop-color="#6d4aff" stop-opacity="0"/></radialGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff513c"/><stop offset=".22" stop-color="#ffe53d"/><stop offset=".48" stop-color="#31ed92"/><stop offset=".7" stop-color="#14baff"/><stop offset="1" stop-color="#f52bc8"/></linearGradient>
    <linearGradient id="glass" x2="0" y2="1"><stop stop-color="#ffffff" stop-opacity=".16"/><stop offset="1" stop-color="#cbd5e1" stop-opacity=".07"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="35"/></filter>
    <filter id="shadow" x="-.2" y="-.3" width="1.4" height="1.8"><feGaussianBlur in="SourceAlpha" stdDeviation="18"/><feOffset dy="18"/><feComponentTransfer><feFuncA type="linear" slope=".5"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="650" rx="32" fill="url(#bg)"/>
  <ellipse cx="610" cy="155" rx="450" ry="235" fill="url(#glow)" filter="url(#blur)"/>
  <circle cx="150" cy="535" r="190" fill="#0c9da6" opacity=".12" filter="url(#blur)"/>
  <text x="65" y="70" fill="#f8fafc" font-family="Segoe UI, Arial" font-size="18" font-weight="700" letter-spacing="3">STYLE SEARCH</text>
  <text x="65" y="103" fill="#9aa8bd" font-family="Segoe UI, Arial" font-size="15">A quick launcher for Windows</text>
  <g filter="url(#shadow)">
    <rect x="190" y="145" width="820" height="94" rx="29" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".24"/>
    <circle cx="235" cy="192" r="21" fill="none" stroke="url(#logo)" stroke-width="8"/>
    <path d="m251 208 15 15" stroke="url(#logo)" stroke-width="9" stroke-linecap="round"/>
    <text x="300" y="203" fill="#f4f6fb" font-family="Segoe UI, Arial" font-size="29">Search apps and files...</text>
    <text x="916" y="202" fill="#d4d9e3" font-family="Segoe UI, Arial" font-size="13">ALT + SPACE</text>
    <rect x="190" y="254" width="820" height="210" rx="25" fill="#0c111a" fill-opacity=".72" stroke="#ffffff" stroke-opacity=".12"/>
    <rect x="210" y="274" width="780" height="52" rx="15" fill="#ffffff" fill-opacity=".11"/>
    <rect x="226" y="286" width="28" height="28" rx="8" fill="#4b88ef"/><text x="233" y="306" fill="white" font-family="Segoe UI, Arial" font-size="16">W</text>
    <text x="271" y="306" fill="#f2f4f8" font-family="Segoe UI, Arial" font-size="16" font-weight="600">Welcome</text><text x="932" y="306" fill="#9da8b8" font-family="Segoe UI, Arial" font-size="12">APPLICATION</text>
    <rect x="226" y="347" width="28" height="28" rx="8" fill="#f5a623"/><text x="233" y="367" fill="#221708" font-family="Segoe UI, Arial" font-size="16">F</text>
    <text x="271" y="367" fill="#e1e6ee" font-family="Segoe UI, Arial" font-size="16">File Explorer</text><text x="932" y="367" fill="#9da8b8" font-family="Segoe UI, Arial" font-size="12">APPLICATION</text>
    <rect x="226" y="408" width="28" height="28" rx="8" fill="#49a6e9"/><text x="234" y="428" fill="white" font-family="Segoe UI, Arial" font-size="16">E</text>
    <text x="271" y="428" fill="#e1e6ee" font-family="Segoe UI, Arial" font-size="16">Edge</text><text x="932" y="428" fill="#9da8b8" font-family="Segoe UI, Arial" font-size="12">APPLICATION</text>
  </g>
  <g>
    <rect x="785" y="492" width="330" height="112" rx="22" fill="#10151f" fill-opacity=".88" stroke="#ffffff" stroke-opacity=".16"/>
    <text x="812" y="526" fill="#f5f7fb" font-family="Segoe UI, Arial" font-size="16" font-weight="600">Personalize your launcher</text>
    <text x="812" y="555" fill="#aeb8c8" font-family="Segoe UI, Arial" font-size="13">Width</text><rect x="864" y="548" width="190" height="5" rx="3" fill="#526077"/><rect x="864" y="548" width="122" height="5" rx="3" fill="#8e78ff"/><circle cx="986" cy="550" r="8" fill="#dcd5ff"/>
    <text x="812" y="581" fill="#aeb8c8" font-family="Segoe UI, Arial" font-size="13">Glass blur</text><rect x="890" y="574" width="164" height="5" rx="3" fill="#526077"/><rect x="890" y="574" width="100" height="5" rx="3" fill="#48d5d0"/><circle cx="990" cy="576" r="8" fill="#d9ffff"/>
  </g>
  <text x="65" y="615" fill="#8290a4" font-family="Segoe UI, Arial" font-size="12">Illustrative preview · not a screenshot of the running app</text>
</svg>
